<body>
  <main>
    <section class="hero"><span>AZURE STORAGE POC</span><h1>StockLens</h1><p>Turn supplier PDFs and Word documents into searchable inventory evidence—automatically.</p></section>
    <section class="card"><h2>Upload a supplier document</h2><p>PDF or DOCX · max 10 MB · Event Grid will start processing after upload.</p><form id="upload-form"><input id="file" name="file" type="file" accept="application/pdf,.pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx" required><button>Upload and process</button></form><output id="notice"></output></section>
